name: "Test: Ota contract matrix"

on:
  workflow_dispatch:
    inputs:
      ota_git_rev:
        description: Ota git revision to install for this matrix run
        required: false
        default: 06feb573cfeeda4f8fe4cef6e6768fdbf7ba0ca7
  pull_request:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"
  push:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: "1"
  OTA_GIT_REV: ${{ github.event.inputs.ota_git_rev || '06feb573cfeeda4f8fe4cef6e6768fdbf7ba0ca7' }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  native-ubuntu:
    name: Ota Contract Matrix (ubuntu-full)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install native prerequisite packages
        shell: bash
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential libpq-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          bundler-cache: false

      - name: Install Bundler
        shell: bash
        run: gem install bundler -v 2.5.3

      - name: Install ota (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV="${OTA_GIT_REV}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = "${env:CARGO_NET_GIT_FETCH_WITH_CLI}"
          $env:OTA_GIT_REV = "${env:OTA_GIT_REV}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Assert ota minimum version from contract
        shell: bash
        run: |
          ota --version | tee ota-version.txt
          required="$(awk -F'\"' '/minimum_version:/{print $2; exit}' ota.yaml)"
          if [ -z "$required" ]; then
            echo "missing metadata.ota.minimum_version in ota.yaml"
            exit 1
          fi
          python3 - "$required" "$(cat ota-version.txt)" <<'PY'
          import re
          import sys

          required = sys.argv[1]
          version_line = sys.argv[2]
          match = re.search(r"v(\d+\.\d+\.\d+)", version_line)
          if not match:
              print(f"unable to parse ota version from: {version_line}", file=sys.stderr)
              raise SystemExit(1)

          current = tuple(int(part) for part in match.group(1).split("."))
          minimum = tuple(int(part) for part in required.split("."))
          if current < minimum:
              print(
                  f"installed ota {match.group(1)} does not satisfy minimum_version {required}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Validate contract
        shell: bash
        run: |
          ota validate --json . > ota-validate.json
          ota validate .

      - name: Doctor verify workflow
        shell: bash
        run: ota doctor --workflow verify .

      - name: List task surfaces
        shell: bash
        run: |
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --unsafe --use .

      - name: List workflows
        shell: bash
        run: ota workflows .

      - name: Export execution topology
        shell: bash
        run: ota execution topology --json . > ota-execution-topology.json

      - name: Dry-run verify workflow
        shell: bash
        run: ota up --workflow verify --native --dry-run .

      - name: Dry-run app workflow
        shell: bash
        run: ota up --workflow app --native --dry-run .

      - name: Execute verify workflow
        timeout-minutes: 90
        shell: bash
        run: ota up --workflow verify --native --stream .

      - name: Proof app workflow
        timeout-minutes: 60
        shell: bash
        run: ota proof runtime --workflow app --native --json . > ota-proof-app.json

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-ubuntu-full
          path: |
            ota-version.txt
            ota-validate.json
            ota-execution-topology.json
            ota-proof-app.json
            .ota/proof/app/topology.json
            .ota/proof/app/doctor.json
            .ota/proof/app/up.log

  native-macos:
    name: Ota Contract Matrix (macos-full)
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install native prerequisite packages
        shell: bash
        run: |
          brew install postgresql@16 pkg-config
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
          brew services start postgresql@16
          for _ in $(seq 1 30); do
            if pg_isready -h localhost -p 5432; then
              break
            fi
            sleep 2
          done
          createuser -s postgres || true
          psql postgres -c "ALTER USER postgres WITH PASSWORD 'ci-postgres-password';"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          bundler-cache: false

      - name: Install Bundler
        shell: bash
        run: gem install bundler -v 2.5.3

      - name: Install ota (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV="${OTA_GIT_REV}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = "${env:CARGO_NET_GIT_FETCH_WITH_CLI}"
          $env:OTA_GIT_REV = "${env:OTA_GIT_REV}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate contract
        shell: bash
        run: ota validate .

      - name: Doctor verify workflow
        shell: bash
        run: ota doctor --workflow verify .

      - name: Dry-run verify workflow
        shell: bash
        run: ota up --workflow verify --native --dry-run .

      - name: Dry-run app workflow
        shell: bash
        run: ota up --workflow app --native --dry-run .

      - name: Execute verify workflow
        timeout-minutes: 90
        shell: bash
        run: ota up --workflow verify --native --stream .

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-macos-full
          path: |
            .ota/proof

  windows-contract:
    name: Ota Contract Matrix (windows-contract)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install ota (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV="${OTA_GIT_REV}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = "${env:CARGO_NET_GIT_FETCH_WITH_CLI}"
          $env:OTA_GIT_REV = "${env:OTA_GIT_REV}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate contract
        shell: powershell
        run: ota validate .

      - name: List task surfaces
        shell: powershell
        run: |
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --unsafe --use .

      - name: List workflows
        shell: powershell
        run: ota workflows .

      - name: Export execution topology
        shell: powershell
        run: ota execution topology --json . | Out-File -FilePath ota-execution-topology.json -Encoding utf8

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-windows-contract
          path: |
            ota-execution-topology.json

  container-ubuntu:
    name: Ota Contract Matrix (ubuntu-container)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install ota (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV="${OTA_GIT_REV}" sh -s -- --from-git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = "${env:CARGO_NET_GIT_FETCH_WITH_CLI}"
          $env:OTA_GIT_REV = "${env:OTA_GIT_REV}"
          & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate contract
        shell: bash
        run: ota validate .

      - name: Dry-run container install
        shell: bash
        run: ota run install --mode container --dry-run .

      - name: Execute container install
        timeout-minutes: 90
        shell: bash
        run: ota run install --mode container --stream .

      - name: Doctor static verify workflow (container)
        continue-on-error: true
        shell: bash
        run: |
          ota doctor --mode container --workflow verify-static .
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Container doctor is advisory in athena-api::container-mode doctor is currently probing repo-local Ruby binstubs outside the hydrated dependency state. The matrix still proves the stronger container lanes below through dry-run and real task execution."
          fi
          exit 0

      - name: Dry-run container lint
        shell: bash
        run: ota run lint --mode container --dry-run .

      - name: Dry-run container security scan
        shell: bash
        run: ota run security:brakeman --mode container --dry-run .

      - name: Dry-run container audit
        shell: bash
        run: ota run security:audit --mode container --dry-run .

      - name: Execute container lint
        timeout-minutes: 60
        shell: bash
        run: ota run lint --mode container --stream .

      - name: Execute container security scan
        timeout-minutes: 60
        shell: bash
        run: ota run security:brakeman --mode container --stream .

      - name: Execute container audit
        timeout-minutes: 60
        shell: bash
        run: ota run security:audit --mode container --stream .

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-ubuntu-container
          path: |
            .ota/proof
